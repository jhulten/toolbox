name: Build and Push Chezmoi Image

on:
  push:
    branches:
      - main
    paths:
      - 'chezmoi/**'
      - '.github/workflows/build-chezmoi-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chezmoi/**'
      - '.github/workflows/build-chezmoi-image.yml'
  workflow_run:
    workflows: ["Build and Push Base Image"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      chezmoi_repo:
        description: 'Dotfiles repository URL (optional, e.g. git@github.com:user/dotfiles.git)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/chezmoi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine base image tag
        id: base-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=sha-$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Optional: Load SSH key for private dotfiles repos accessed via SSH.
      # Set DOTFILES_DEPLOY_KEY secret to a private SSH key with read access
      # to the dotfiles repository, then pass CHEZMOI_REPO as a workflow
      # dispatch input (e.g. git@github.com:user/dotfiles.git).
      - name: Set up SSH agent for private dotfiles repo
        if: ${{ secrets.DOTFILES_DEPLOY_KEY != '' && inputs.chezmoi_repo != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOTFILES_DEPLOY_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./chezmoi
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_TAG=${{ steps.base-tag.outputs.tag }}
            CHEZMOI_REPO=${{ inputs.chezmoi_repo }}
          # Mount the SSH agent socket when building with a private SSH repo
          ssh: ${{ secrets.DOTFILES_DEPLOY_KEY != '' && inputs.chezmoi_repo != '' && 'default' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

